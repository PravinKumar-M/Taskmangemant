# ============================================
# Nginx Configuration - Task Management System
# ============================================
# 
# Usage:
#   1. Copy this file to your Nginx config directory
#      - Windows: C:\nginx\conf\nginx.conf
#      - Linux:   /etc/nginx/sites-available/task-management
#
#   2. Update the paths and domain as needed
#
#   3. Test config:  nginx -t
#   4. Reload:       nginx -s reload
# ============================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ========================
    # Performance
    # ========================
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # ========================
    # Gzip Compression
    # ========================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ========================
    # Logging
    # ========================
    access_log  logs/task_management_access.log;
    error_log   logs/task_management_error.log;

    # ========================
    # Rate Limiting
    # ========================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # ========================
    # Upstream - Backend API
    # ========================
    upstream backend_api {
        server 127.0.0.1:5000;
        keepalive 32;
    }

    # ========================
    # HTTP -> HTTPS Redirect
    # (Uncomment for production)
    # ========================
    # server {
    #     listen 80;
    #     server_name yourdomain.com www.yourdomain.com;
    #     return 301 https://$server_name$request_uri;
    # }

    # ========================
    # Main Server Block
    # ========================
    server {
        listen 80;
        server_name localhost;

        # ------------------------------------------------
        # For HTTPS (uncomment and update paths for production)
        # ------------------------------------------------
        # listen 443 ssl http2;
        # ssl_certificate     /etc/ssl/certs/yourdomain.crt;
        # ssl_certificate_key /etc/ssl/private/yourdomain.key;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers         HIGH:!aNULL:!MD5;
        # ssl_prefer_server_ciphers on;

        # ========================
        # Security Headers
        # ========================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ========================
        # Frontend - Static Files
        # ========================
        # Serves the built React app from client/dist
        # Run "npm run build" in client/ first
        #
        # UPDATE THIS PATH to match your deployment:
        #   Windows: C:/path/to/Task Management System/client/dist
        #   Linux:   /var/www/task-management/client/dist
        # ========================
        root  client/dist;
        index index.html;

        # ========================
        # API Proxy - /api/*
        # ========================
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # ========================
        # Stricter Rate Limit for Login
        # ========================
        location /api/auth/login {
            limit_req zone=login_limit burst=3 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # ========================
        # Health Check Endpoint
        # ========================
        location /api/health {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ========================
        # Static Asset Caching
        # ========================
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ========================
        # SPA Fallback
        # All non-API, non-file routes -> index.html
        # (Required for React Router)
        # ========================
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ========================
        # Block Hidden Files
        # ========================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ========================
        # Custom Error Pages
        # ========================
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root html;
            internal;
        }
    }
}
